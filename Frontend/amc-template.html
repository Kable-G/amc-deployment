<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMediaCenter - Template</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- ✅ ONLY ONE CSS FILE FOR EVERYTHING -->
    <link rel="stylesheet" href="css/amc-globalshell.css">
    
    <!-- Premium Avatar System Styles -->
    <link rel="stylesheet" href="amc-avatar-styles.css">
</head>
<body>
    <!-- AMC Header Component -->
    <amc-header></amc-header>

    <div class="amc-app">
        <!-- Enterprise Sidebar -->
        <aside id="sidebar" class="amc-sidebar">
            <!-- Content will be dynamically generated by components/sidebar.js -->
        </aside>
        
        <!-- Main Content -->
        <main class="amc-content">
            <div class="main-content">
                <h1>Template Page</h1>
                <p>Simple template with header and sidebar components.</p>
            </div>
        </main>
    </div>

    <!-- Load AMC Components -->
    <script src="components/amc-header.js"></script>
    <script src="components/sidebar.js"></script>
    
    <!-- Premium Avatar System -->
    <script defer src="amc-avatar-system.js"></script>
    
</body>
</html>
