<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMC Tools Drawer</title>
<!--
  JOURNALIST TOOLS DRAWER
  ========================
  Self-contained tools drawer for AutoMediaCenter.
  Inject this file's <style> block and <body> content into any AMC page.
  Call AMCTools.open('unit') / AMCTools.close() from anywhere.
  
  INTEGRATION STEPS:
  1. Add the <style> block to the page <head>
  2. Add the drawer HTML (everything inside <body>) before </body>
  3. Add the <script> block
  4. In the avatar modal "Tools" click handler, call: AMCTools.open('unit')
  5. In the shell JS, add 'unit-converter.html' link to sidebar Tools section
-->
<style>
/* ═══════════════════════════════════════════════
   AMC JOURNALIST TOOLS DRAWER
   Uses AMC v6.5 CSS variables — must be loaded after v6_5-shell.css
   ═══════════════════════════════════════════════ */

/* ── Overlay ── */
#amc-tools-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.4);
  z-index:2000; opacity:0; visibility:hidden;
  transition:opacity 280ms cubic-bezier(0.16,1,0.3,1), visibility 280ms;
  backdrop-filter:blur(2px);
}
#amc-tools-overlay.open { opacity:1; visibility:visible; }

/* ── Drawer ── */
#amc-tools-drawer {
  position:fixed; top:0; right:0; bottom:0;
  width:520px; max-width:100vw;
  background:var(--bg-secondary,#1a1f2e);
  border-left:1px solid var(--border-primary,#2d3748);
  z-index:2001;
  display:flex; flex-direction:column;
  transform:translateX(100%);
  transition:transform 300ms cubic-bezier(0.16,1,0.3,1);
  box-shadow:-8px 0 40px rgba(0,0,0,0.3);
}
#amc-tools-drawer.open { transform:translateX(0); }

/* ── Drawer header ── */
.atd-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px 0;
  border-bottom:1px solid var(--border-primary,#2d3748);
  flex-shrink:0;
  gap:12px;
}
.atd-title {
  font-family:'Inter',sans-serif; font-size:15px; font-weight:700;
  color:var(--text-headings,#f1f5f9); display:flex; align-items:center; gap:8px;
  flex-shrink:0;
}
.atd-title i { color:var(--accent-primary,#3b82f6); font-size:14px; }

/* ── Tab bar ── */
.atd-tabs {
  display:flex; gap:0; flex:1; border-bottom:none;
}
.atd-tab {
  padding:12px 16px 10px;
  font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
  letter-spacing:0.04em; text-transform:uppercase;
  color:var(--text-secondary,#94a3b8);
  background:transparent; border:none; cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color 150ms, border-color 150ms;
  white-space:nowrap;
  display:flex; align-items:center; gap:6px;
}
.atd-tab:hover { color:var(--text-primary,#e2e8f0); }
.atd-tab.active {
  color:var(--accent-primary,#3b82f6);
  border-bottom-color:var(--accent-primary,#3b82f6);
}
.atd-tab .atd-soon {
  font-size:9px; padding:1px 5px; border-radius:3px;
  background:rgba(148,163,184,0.1); color:var(--text-secondary,#94a3b8);
  font-weight:600; letter-spacing:0.05em;
}
.atd-close {
  width:32px; height:32px; border-radius:8px;
  background:transparent; border:1px solid var(--border-primary,#2d3748);
  color:var(--text-secondary,#94a3b8); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; flex-shrink:0; margin-bottom:2px;
  transition:all 150ms;
}
.atd-close:hover { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.3); color:#ef4444; }

/* ── Content area ── */
.atd-content {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:0;
  scroll-behavior:smooth;
}
.atd-panel { display:none; height:100%; }
.atd-panel.active { display:flex; flex-direction:column; }

/* ── Coming soon panel ── */
.atd-coming-soon {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px;
  padding:40px; text-align:center;
}
.atd-coming-soon i { font-size:36px; color:var(--border-primary,#2d3748); }
.atd-coming-soon h3 { font-family:'Inter',sans-serif; font-size:16px; font-weight:700; color:var(--text-headings,#f1f5f9); margin:0; }
.atd-coming-soon p { font-family:'Inter',sans-serif; font-size:13px; color:var(--text-secondary,#94a3b8); margin:0; line-height:1.6; }

/* ═══════════════════════════════════════════════
   UNIT CONVERTER — HUB VIEW
   ═══════════════════════════════════════════════ */
.uc-hub {
  padding:16px 20px 20px;
  display:flex; flex-direction:column; gap:12px;
}
.uc-hub-hint {
  font-family:'Inter',sans-serif; font-size:11px; font-weight:500;
  color:var(--text-secondary,#94a3b8); letter-spacing:0.03em;
  display:flex; align-items:center; gap:6px; padding:0 2px;
}
.uc-hub-hint i { font-size:11px; opacity:0.6; }

/* ── Category grid ── */
.uc-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
@media(max-width:480px){ .uc-grid { grid-template-columns:repeat(2,1fr); } }

.uc-card {
  background:var(--bg-tertiary,#161b26);
  border:1px solid var(--border-primary,#2d3748);
  border-radius:10px; padding:14px 12px 12px;
  cursor:grab; text-decoration:none;
  display:flex; flex-direction:column; align-items:center;
  gap:8px; text-align:center;
  transition:border-color 150ms, transform 150ms, box-shadow 150ms;
  user-select:none; position:relative; overflow:hidden;
}
.uc-card:hover {
  border-color:var(--accent-primary,#3b82f6);
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(59,130,246,0.12);
}
.uc-card:active { cursor:grabbing; }
.uc-card.dragging { opacity:0.5; transform:rotate(2deg) scale(1.02); border-color:var(--accent-primary,#3b82f6); }
.uc-card.drag-over { border-color:var(--accent-primary,#3b82f6); background:rgba(59,130,246,0.05); }

.uc-card-icon {
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:15px;
  background:rgba(59,130,246,0.08); color:var(--accent-primary,#3b82f6);
}
/* Different colours per category type */
.uc-card[data-cat="Power"] .uc-card-icon,
.uc-card[data-cat="ChargingSpeed"] .uc-card-icon,
.uc-card[data-cat="EnergyStorage"] .uc-card-icon { background:rgba(245,158,11,0.08); color:#f59e0b; }
.uc-card[data-cat="Speed"] .uc-card-icon,
.uc-card[data-cat="Distance"] .uc-card-icon { background:rgba(59,130,246,0.08); color:#3b82f6; }
.uc-card[data-cat="Torque"] .uc-card-icon,
.uc-card[data-cat="Force"] .uc-card-icon { background:rgba(239,68,68,0.08); color:#ef4444; }
.uc-card[data-cat="FuelConsumption"] .uc-card-icon,
.uc-card[data-cat="EnergyConsumption"] .uc-card-icon,
.uc-card[data-cat="Emissions"] .uc-card-icon { background:rgba(16,185,129,0.08); color:#10b981; }
.uc-card[data-cat="Weight"] .uc-card-icon,
.uc-card[data-cat="Dimensions"] .uc-card-icon,
.uc-card[data-cat="Area"] .uc-card-icon { background:rgba(168,85,247,0.08); color:#a855f7; }

.uc-card-name {
  font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
  color:var(--text-primary,#e2e8f0); line-height:1.3;
}
.uc-drag-hint {
  position:absolute; top:6px; right:6px;
  font-size:9px; color:var(--text-secondary,#94a3b8); opacity:0.4;
}

/* ═══════════════════════════════════════════════
   UNIT CONVERTER — DETAIL VIEW
   ═══════════════════════════════════════════════ */
.uc-detail { display:flex; flex-direction:column; height:100%; }

.uc-detail-header {
  display:flex; align-items:center; gap:10px;
  padding:14px 20px 12px;
  border-bottom:1px solid var(--border-primary,#2d3748);
  flex-shrink:0;
}
.uc-back-btn {
  width:30px; height:30px; border-radius:7px;
  background:transparent; border:1px solid var(--border-primary,#2d3748);
  color:var(--text-secondary,#94a3b8); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; transition:all 150ms; flex-shrink:0;
}
.uc-back-btn:hover { background:var(--bg-tertiary,#161b26); color:var(--text-primary,#e2e8f0); border-color:var(--accent-primary,#3b82f6); }
.uc-detail-title {
  font-family:'Inter',sans-serif; font-size:14px; font-weight:700;
  color:var(--text-headings,#f1f5f9); flex:1;
  display:flex; align-items:center; gap:8px;
}
.uc-detail-title i { color:var(--accent-primary,#3b82f6); font-size:13px; }
.uc-detail-actions { display:flex; gap:6px; }
.uc-action-btn {
  height:28px; padding:0 10px; border-radius:6px;
  background:transparent; border:1px solid var(--border-primary,#2d3748);
  color:var(--text-secondary,#94a3b8); cursor:pointer;
  font-family:'Inter',sans-serif; font-size:11px; font-weight:500;
  display:flex; align-items:center; gap:5px;
  transition:all 150ms; white-space:nowrap;
}
.uc-action-btn:hover { border-color:var(--accent-primary,#3b82f6); color:var(--accent-primary,#3b82f6); }

.uc-units { flex:1; overflow-y:auto; padding:12px 20px 16px; display:flex; flex-direction:column; gap:8px; }

.uc-unit-row {
  display:grid; grid-template-columns:72px 1fr;
  align-items:center; gap:10px;
  padding:8px 12px; border-radius:8px;
  background:var(--bg-tertiary,#161b26);
  border:1px solid var(--border-primary,#2d3748);
  transition:border-color 150ms;
}
.uc-unit-row:focus-within { border-color:var(--accent-primary,#3b82f6); background:rgba(59,130,246,0.03); }

.uc-symbol {
  font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
  color:var(--accent-primary,#3b82f6); text-align:center;
  cursor:help; position:relative;
}
.uc-symbol:hover .uc-tooltip { opacity:1; pointer-events:auto; }
.uc-tooltip {
  position:absolute; left:0; top:calc(100% + 6px);
  width:200px; background:var(--bg-primary,#0f1523);
  border:1px solid var(--border-primary,#2d3748);
  border-radius:8px; padding:10px 12px;
  font-size:11px; color:var(--text-secondary,#94a3b8); line-height:1.5;
  font-weight:400; z-index:100; opacity:0; pointer-events:none;
  transition:opacity 150ms; box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.uc-unit-right { display:flex; flex-direction:column; gap:2px; }
.uc-input-wrap { position:relative; display:flex; align-items:center; }
.uc-input {
  width:100%; padding:7px 28px 7px 10px;
  background:var(--bg-secondary,#1a1f2e);
  border:1px solid transparent; border-radius:6px;
  color:var(--text-headings,#f1f5f9);
  font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
  font-variant-numeric:tabular-nums;
  transition:border-color 150ms; outline:none;
}
.uc-input::placeholder { color:var(--text-secondary,#94a3b8); font-weight:400; font-size:13px; }
.uc-input:focus { border-color:var(--accent-primary,#3b82f6); }
.uc-clear-btn {
  position:absolute; right:6px;
  width:18px; height:18px; border-radius:50%;
  background:var(--border-primary,#2d3748); border:none;
  color:var(--text-secondary,#94a3b8); cursor:pointer;
  font-size:11px; display:none; align-items:center; justify-content:center;
  transition:all 120ms;
}
.uc-clear-btn:hover { background:rgba(239,68,68,0.2); color:#ef4444; }
.uc-unit-label {
  font-family:'Inter',sans-serif; font-size:10px;
  color:var(--text-secondary,#94a3b8); padding-left:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ── Next converter footer ── */
.uc-next-bar {
  padding:10px 20px 14px;
  border-top:1px solid var(--border-primary,#2d3748);
  flex-shrink:0; display:flex; justify-content:flex-end;
}
.uc-next-btn {
  padding:8px 16px; border-radius:8px;
  background:var(--bg-tertiary,#161b26);
  border:1px solid var(--border-primary,#2d3748);
  color:var(--text-secondary,#94a3b8);
  font-family:'Inter',sans-serif; font-size:12px; font-weight:500;
  cursor:pointer; display:flex; align-items:center; gap:6px;
  transition:all 150ms;
}
.uc-next-btn:hover { border-color:var(--accent-primary,#3b82f6); color:var(--accent-primary,#3b82f6); }

/* ── Toast ── */
.uc-toast-wrap {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  z-index:3000; display:flex; flex-direction:column; gap:8px; align-items:center;
  pointer-events:none;
}
.uc-toast {
  padding:9px 16px; border-radius:8px; font-family:'Inter',sans-serif;
  font-size:12px; font-weight:500; color:#fff;
  display:flex; align-items:center; gap:7px;
  animation:uc-toast-in 250ms cubic-bezier(0.16,1,0.3,1) both;
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.uc-toast.success { background:#10b981; }
.uc-toast.info { background:#3b82f6; }
.uc-toast.warning { background:#f59e0b; }
.uc-toast.error { background:#ef4444; }
.uc-toast.fade-out { animation:uc-toast-out 200ms ease forwards; }
@keyframes uc-toast-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes uc-toast-out { to{opacity:0;transform:translateY(4px)} }

/* ── Scrollbar ── */
.atd-content::-webkit-scrollbar,
.uc-units::-webkit-scrollbar { width:4px; }
.atd-content::-webkit-scrollbar-thumb,
.uc-units::-webkit-scrollbar-thumb { background:var(--border-primary,#2d3748); border-radius:2px; }

/* ── Mobile responsive ── */
@media(max-width:600px) {
  #amc-tools-drawer { width:100vw; border-left:none; border-top:1px solid var(--border-primary,#2d3748); top:56px; border-radius:16px 16px 0 0; }
  .uc-grid { grid-template-columns:repeat(2,1fr); }
  .uc-unit-row { grid-template-columns:56px 1fr; }
  .atd-tab { font-size:11px; padding:10px 12px 8px; }
}

/* ── Light mode overrides ── */
body:not(.dark-mode) #amc-tools-drawer { background:#ffffff; border-color:#e2e8f0; }
body:not(.dark-mode) .uc-card { background:#f8fafc; border-color:#e2e8f0; }
body:not(.dark-mode) .uc-unit-row { background:#f8fafc; border-color:#e2e8f0; }
body:not(.dark-mode) .uc-input { background:#ffffff; color:#1e293b; }
body:not(.dark-mode) .atd-header { border-color:#e2e8f0; }
body:not(.dark-mode) .atd-title,
body:not(.dark-mode) .uc-detail-title,
body:not(.dark-mode) .uc-card-name { color:#1e293b; }
body:not(.dark-mode) .atd-tab { color:#64748b; }
body:not(.dark-mode) .atd-tab.active { color:#3b82f6; }
body:not(.dark-mode) .uc-symbol { color:#3b82f6; }
body:not(.dark-mode) .uc-tooltip { background:#1e293b; border-color:#334155; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     JOURNALIST TOOLS DRAWER HTML
     ═══════════════════════════════════════════════ -->

<!-- Overlay -->
<div id="amc-tools-overlay" onclick="AMCTools.close()"></div>

<!-- Drawer -->
<div id="amc-tools-drawer" role="dialog" aria-label="Tools">

  <!-- Header with tabs and close -->
  <div class="atd-header">
    <div class="atd-title"><i class="fas fa-wrench"></i> Tools</div>
    <div class="atd-tabs">
      <button class="atd-tab active" data-tab="unit" onclick="AMCTools.switchTab('unit')">
        <i class="fas fa-ruler-combined"></i> Units
      </button>
      <button class="atd-tab" data-tab="currency" onclick="AMCTools.switchTab('currency')">
        <i class="fas fa-dollar-sign"></i> FX
        <span class="atd-soon">Soon</span>
      </button>
      <button class="atd-tab" data-tab="timezone" onclick="AMCTools.switchTab('timezone')">
        <i class="fas fa-clock"></i> TZ
        <span class="atd-soon">Soon</span>
      </button>
    </div>
    <button class="atd-close" onclick="AMCTools.close()" title="Close (Esc)"><i class="fas fa-times"></i></button>
  </div>

  <!-- Content panels -->
  <div class="atd-content">

    <!-- ── Unit Converter Panel ── -->
    <div class="atd-panel active" id="atd-unit">

      <!-- Hub view: category grid -->
      <div class="uc-hub" id="uc-hub">
        <div class="uc-hub-hint"><i class="fas fa-grip-vertical"></i> Drag tiles to reorder your favourites</div>
        <div class="uc-grid" id="uc-grid"></div>
      </div>

      <!-- Detail view: unit inputs -->
      <div class="uc-detail" id="uc-detail" style="display:none">
        <div class="uc-detail-header">
          <button class="uc-back-btn" onclick="UCEngine.showHub()" title="Back"><i class="fas fa-arrow-left"></i></button>
          <div class="uc-detail-title">
            <i id="uc-detail-icon" class="fas fa-bolt"></i>
            <span id="uc-detail-name">Power</span>
          </div>
          <div class="uc-detail-actions">
            <button class="uc-action-btn" onclick="UCEngine.reset()"><i class="fas fa-rotate-left"></i> Reset</button>
            <button class="uc-action-btn" onclick="UCEngine.copy()"><i class="fas fa-copy"></i> Copy</button>
          </div>
        </div>
        <div class="uc-units" id="uc-units"></div>
        <div class="uc-next-bar">
          <button class="uc-next-btn" id="uc-next-btn" onclick="UCEngine.loadNext()">
            Next: <span id="uc-next-name"></span> <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </div>

    </div><!-- /unit panel -->

    <!-- ── Currency Panel (coming soon) ── -->
    <div class="atd-panel" id="atd-currency">
      <div class="atd-coming-soon">
        <i class="fas fa-dollar-sign"></i>
        <h3>Currency Converter</h3>
        <p>Convert between global currencies with live exchange rates. Coming in the next sprint.</p>
      </div>
    </div>

    <!-- ── Timezone Panel (coming soon) ── -->
    <div class="atd-panel" id="atd-timezone">
      <div class="atd-coming-soon">
        <i class="fas fa-clock"></i>
        <h3>Timezone Converter</h3>
        <p>Convert embargo times and event schedules across global timezones. Coming in the next sprint.</p>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /drawer -->

<!-- Toast container -->
<div class="uc-toast-wrap" id="uc-toasts"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// AMC TOOLS DRAWER — Global API
// ═══════════════════════════════════════════════════════════

window.AMCTools = {
  open(tab) {
    document.getElementById('amc-tools-overlay').classList.add('open');
    document.getElementById('amc-tools-drawer').classList.add('open');
    document.body.style.overflow = 'hidden';
    if (tab) this.switchTab(tab);
    if (tab === 'unit' || !tab) UCEngine.initHub();
  },
  close() {
    document.getElementById('amc-tools-overlay').classList.remove('open');
    document.getElementById('amc-tools-drawer').classList.remove('open');
    document.body.style.overflow = '';
  },
  switchTab(name) {
    document.querySelectorAll('.atd-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.atd-panel').forEach(p => p.classList.toggle('active', p.id === 'atd-' + name));
    if (name === 'unit') UCEngine.initHub();
  }
};

// Close on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') AMCTools.close(); });

// ═══════════════════════════════════════════════════════════
// UNIT CONVERTER ENGINE
// ═══════════════════════════════════════════════════════════

const UCEngine = (() => {

// ── Conversion data (all validated factors from original) ──
const converters = {
  Power: {
    units:['kW','PS','bhp','hp','W','MW'],
    symbols:{kW:'kW',PS:'PS',bhp:'bhp',hp:'hp',W:'W',MW:'MW'},
    labels:{kW:'kilowatts',PS:'metric horsepower (PS)',bhp:'brake horsepower',hp:'mechanical horsepower',W:'watts',MW:'megawatts'},
    tooltips:{kW:'Standard SI unit of power. Most modern vehicles specify power in kW.',PS:'Pferdestärke — European/German standard. 1 PS = 735.5W.',bhp:'Brake horsepower — power at the flywheel before drivetrain losses.',hp:'Mechanical horsepower. 1 hp = 745.7W, slightly different from PS.',W:'Base SI unit of power.',MW:'1 MW = 1000 kW. Used for large industrial applications.'},
    baseUnit:'kW',
    factors:{kW:1,PS:0.73549875,bhp:0.745699872,hp:0.745699872,W:0.001,MW:1000}
  },
  Torque: {
    units:['Nm','lbFt','kgM','ozIn','kgCm'],
    symbols:{Nm:'Nm',lbFt:'lb·ft',kgM:'kg·m',ozIn:'oz·in',kgCm:'kg·cm'},
    labels:{Nm:'newton-meters',lbFt:'pound-feet',kgM:'kilogram-meters',ozIn:'ounce-inches',kgCm:'kilogram-centimeters'},
    tooltips:{Nm:'SI unit of torque, standard worldwide.',lbFt:'Imperial unit, standard in the United States.',kgM:'Older metric unit in vintage car specifications.',ozIn:'For very small torque values.',kgCm:'Smaller torque applications and some motorcycles.'},
    baseUnit:'Nm',
    factors:{Nm:1,lbFt:1.35581795,kgM:9.80665,ozIn:0.00706155,kgCm:0.0980665}
  },
  Speed: {
    units:['kmh','mph','ms','fts','knots','mach'],
    symbols:{kmh:'km/h',mph:'mph',ms:'m/s',fts:'ft/s',knots:'kn',mach:'Mach'},
    labels:{kmh:'kilometers per hour',mph:'miles per hour',ms:'meters per second',fts:'feet per second',knots:'knots',mach:'speed of sound'},

const ICONS = {
  Power:'fa-bolt',Torque:'fa-wrench',Speed:'fa-tachometer-alt',Distance:'fa-road',
  Weight:'fa-weight-hanging',Dimensions:'fa-ruler',Volume:'fa-fill-drip',
  Pressure:'fa-gauge-high',Temperature:'fa-thermometer-half',
  FuelConsumption:'fa-gas-pump',EnergyConsumption:'fa-leaf',ChargingSpeed:'fa-charging-station',
  EnergyStorage:'fa-battery-full',Emissions:'fa-smog',EngineDisplacement:'fa-engine',Area:'fa-vector-square'
};
const NAMES = {
  Power:'Power',Torque:'Torque',Speed:'Speed',Distance:'Distance',
  Weight:'Weight',Dimensions:'Dimensions',Volume:'Volume',
  Pressure:'Pressure',Temperature:'Temperature',
  FuelConsumption:'Fuel Consumption',EnergyConsumption:'Energy Consumption',
  ChargingSpeed:'Charging Speed',EnergyStorage:'Energy Storage',
  Emissions:'Emissions',EngineDisplacement:'Engine Displacement',Area:'Area'
};

const DEFAULT_ORDER = Object.keys(converters);
let order = [], current = null, cfg = {}, lastInput = null, isCalc = false;
let dragEl = null, dragIdx = -1;
let touchStart = null, touchCurrent = null, isTouchDrag = false;

// ── Persistence ──
function loadOrder() {
  try {
    const s = localStorage.getItem('amc_uc_order_v2');
    if (s) {
      const parsed = JSON.parse(s);
      order = DEFAULT_ORDER.slice();
      parsed.forEach((k,i) => {
        const cur = order.indexOf(k);
        if (cur > -1) { order.splice(cur,1); order.splice(i,0,k); }
      });
    } else order = DEFAULT_ORDER.slice();
  } catch { order = DEFAULT_ORDER.slice(); }
}
function saveOrder() { localStorage.setItem('amc_uc_order_v2', JSON.stringify(order)); }

// ── Hub ──
function initHub() {
  loadOrder();
  renderHub();
}

function renderHub() {
  const grid = document.getElementById('uc-grid');
  if (!grid) return;
  grid.innerHTML = '';
  order.forEach((key, idx) => {
    const card = document.createElement('div');
    card.className = 'uc-card'; card.draggable = true;
    card.dataset.cat = key; card.dataset.idx = idx;
    card.innerHTML = `<div class="uc-drag-hint"><i class="fas fa-grip-dots-vertical"></i></div><div class="uc-card-icon"><i class="fas ${ICONS[key]||'fa-question'}"></i></div><div class="uc-card-name">${NAMES[key]||key}</div>`;
    card.onclick = (e) => { if (!card.classList.contains('dragging')) loadConverter(key); };
    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragend', onDragEnd);
    card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; });
    card.addEventListener('dragenter', function() { if(this!==dragEl) this.classList.add('drag-over'); });
    card.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
    card.addEventListener('drop', onDrop);
    card.addEventListener('touchstart', onTouchStart, {passive:false});
    card.addEventListener('touchmove', onTouchMove, {passive:false});
    card.addEventListener('touchend', onTouchEnd);
    grid.appendChild(card);
  });
}

function showHub() {
  document.getElementById('uc-hub').style.display = '';
  document.getElementById('uc-detail').style.display = 'none';
  current = null; cfg = {};
}

// ── Drag & Drop ──
function onDragStart(e) {
  dragEl = this; dragIdx = parseInt(this.dataset.idx);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => this.style.opacity='0.5', 0);
}
function onDragEnd(e) {
  this.classList.remove('dragging'); this.style.opacity='';
  document.querySelectorAll('.uc-card').forEach(c => c.classList.remove('drag-over'));
  dragEl=null; dragIdx=-1;
}
function onDrop(e) {
  e.stopPropagation(); this.classList.remove('drag-over');
  if (this !== dragEl) {
    const di = dragIdx, ti = parseInt(this.dataset.idx);
    const moved = order.splice(di,1)[0];
    order.splice(ti,0,moved);
    saveOrder(); renderHub();
    toast('Layout saved','success',2500);
  }
  return false;
}

// ── Touch drag ──
function onTouchStart(e) { touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; isTouchDrag=false; }
function onTouchMove(e) {
  if (!touchStart) return;
  touchCurrent={x:e.touches[0].clientX,y:e.touches[0].clientY};
  const dx=Math.abs(touchCurrent.x-touchStart.x), dy=Math.abs(touchCurrent.y-touchStart.y);
  if (!isTouchDrag && (dx>10||dy>10)) { isTouchDrag=true; this.classList.add('dragging'); }
  if (isTouchDrag) { e.preventDefault(); this.style.transform=`translate(${touchCurrent.x-touchStart.x}px,${touchCurrent.y-touchStart.y}px) rotate(3deg) scale(1.05)`; }
}
function onTouchEnd(e) {
  if (isTouchDrag && touchCurrent) {
    this.classList.remove('dragging'); this.style.transform='';
    const el = document.elementFromPoint(touchCurrent.x,touchCurrent.y);
    const target = el?.closest('.uc-card');
    if (target && target!==this) {
      const di=parseInt(this.dataset.idx), ti=parseInt(target.dataset.idx);
      const moved=order.splice(di,1)[0]; order.splice(ti,0,moved);
      saveOrder(); renderHub(); toast('Layout saved','success',2500);
    }
  } else if (!isTouchDrag && this.dataset.cat) {
    loadConverter(this.dataset.cat);
  }
  touchStart=null; touchCurrent=null; isTouchDrag=false;
}

// ── Converter detail ──
function loadConverter(key) {
  if (!converters[key]) return;
  current = key; cfg = converters[key]; lastInput = null;
  document.getElementById('uc-hub').style.display = 'none';
  document.getElementById('uc-detail').style.display = 'flex';
  document.getElementById('uc-detail-icon').className = `fas ${ICONS[key]||'fa-question'}`;
  document.getElementById('uc-detail-name').textContent = NAMES[key]||key;
  const units = document.getElementById('uc-units');
  units.innerHTML = '';
  cfg.units.forEach((u,i) => units.appendChild(makeRow(u)));
  // Next button
  const ci = order.indexOf(key);
  const nextBtn = document.getElementById('uc-next-btn');
  const nextName = document.getElementById('uc-next-name');
  if (ci < order.length-1) {
    nextName.textContent = NAMES[order[ci+1]]||order[ci+1];
    nextBtn.style.display = 'flex';
  } else nextBtn.style.display = 'none';
  // Auto-set first field to 1
  const firstInput = document.getElementById('uc-input-'+cfg.units[0]);
  if (firstInput) { setTimeout(()=>{ firstInput.value='1'; firstInput.focus(); firstInput.select(); doConvert(cfg.units[0],1); },80); }
}

function makeRow(unit) {
  const sym = cfg.symbols[unit]||unit;
  const lbl = cfg.labels[unit]||unit;
  const tip = cfg.tooltips?.[unit]||lbl;
  const row = document.createElement('div');
  row.className = 'uc-unit-row';
  row.innerHTML = `
    <div class="uc-symbol">${sym}<div class="uc-tooltip">${tip}</div></div>
    <div class="uc-unit-right">
      <div class="uc-input-wrap">
        <input class="uc-input" type="text" inputmode="decimal" id="uc-input-${unit}" placeholder="0" aria-label="${lbl}">
        <button class="uc-clear-btn" onclick="UCEngine._clearOne('${unit}')" tabindex="-1">×</button>
      </div>
      <div class="uc-unit-label">${lbl}</div>
    </div>`;
  const inp = row.querySelector('.uc-input');
  const clr = row.querySelector('.uc-clear-btn');
  inp.addEventListener('focus', function() { lastInput=this; this.select(); });
  let debTimer;
  inp.addEventListener('input', function() {
    clr.style.display = this.value.trim() ? 'flex' : 'none';
    clearTimeout(debTimer);
    debTimer = setTimeout(()=>{
      const v = parseFloat(this.value);
      if (!isNaN(v)) doConvert(unit,v);
      else if (!this.value.trim()) clearAll(unit);
    },250);
  });
  return row;
}

// ── Conversion logic ──
function doConvert(src, val) {
  if (!current||!cfg?.units||isCalc) return;
  isCalc=true;
  try {
    if (cfg.isSpecial && current==='Temperature') convTemp(src,val);
    else if (cfg.isSpecialEnergyConsumption) convEnergy(src,val);
    else if (cfg.isSpecialEmissions) convEmissions(src,val);
    else convLinear(src,val);
  } catch(e) { console.error(e); }
  isCalc=false;
}

function convLinear(src, val) {
  const f=cfg.factors, b=cfg.baseUnit;
  let base;
  if (cfg.isInverse) {
    if (src==='l100km') base=val;
    else if (['mpgUS','mpgUK','kml'].includes(src)) base=f[src]/val;
    else base=val*f[src];
  } else base=val*f[src];
  cfg.units.forEach(t => {
    if (t===src) return;
    const el=document.getElementById('uc-input-'+t); if(!el) return;
    let r;
    if (cfg.isInverse) {
      if (t==='l100km') r=base;
      else if (['mpgUS','mpgUK','kml'].includes(t)) r=f[t]/base;
      else r=base/f[t];
    } else r=base/f[t];
    setVal(t,r);
  });
}

function convTemp(src,v) {
  let C,F,K;
  if (src==='C') { C=v; F=v*1.8+32; K=v+273.15; }
  else if (src==='F') { F=v; C=(v-32)/1.8; K=C+273.15; }
  else { K=v; if(K<0) return; C=K-273.15; F=C*1.8+32; }
  const m={C,F,K};
  cfg.units.forEach(t=>{ if(t!==src) setVal(t,m[t]); });
}

function convEnergy(src,v) {
  let c={};
  const km2mi=1.60934;
  if (src==='kWhper100km') {
    c.kWhper100km=v; c.Whperkm=v*10;
    c.kWhpermi=(v/100)*km2mi; c.MPGe=33.705/c.kWhpermi;
  } else if (src==='Whperkm') {
    c.Whperkm=v; c.kWhper100km=v/10;
    c.kWhpermi=(v/1000)*km2mi; c.MPGe=33.705/c.kWhpermi;
  } else if (src==='kWhpermi') {
    c.kWhpermi=v; c.kWhper100km=(v/km2mi)*100;
    c.Whperkm=(v*1000)/km2mi; c.MPGe=33.705/v;
  } else if (src==='MPGe') {
    c.MPGe=v; c.kWhpermi=33.705/v;
    c.kWhper100km=(c.kWhpermi/km2mi)*100; c.Whperkm=(c.kWhpermi*1000)/km2mi;
  }
  cfg.units.forEach(t=>{ if(t!==src&&c[t]!==undefined) setVal(t,c[t]); });
}

function convEmissions(src,v) {
  const gLb=0.00220462, km2mi=1.609344;
  let c={};
  if (src==='gCO2perkm') { c.gCO2perkm=v; c.gCO2permile=v*km2mi; c.kgCO2per100km=(v/1000)*100; }
  else if (src==='gCO2permile') { c.gCO2perkm=v/km2mi; c.gCO2permile=v; c.kgCO2per100km=(c.gCO2perkm/1000)*100; }
  else if (src==='kgCO2per100km') { c.gCO2perkm=(v*1000)/100; c.gCO2permile=c.gCO2perkm*km2mi; c.kgCO2per100km=v; }
  cfg.units.forEach(t=>{ if(t!==src&&c[t]!==undefined) setVal(t,c[t]); });
}

function setVal(unit,val) {
  const el=document.getElementById('uc-input-'+unit); if(!el) return;
  el.value = (val===0)?'0':fmt(val);
  el.nextElementSibling.style.display='flex';
}

function clearAll(exclude) {
  if (!cfg?.units) return;
  cfg.units.forEach(u=>{
    if (u===exclude) return;
    const el=document.getElementById('uc-input-'+u); if(!el) return;
    el.value=''; el.nextElementSibling.style.display='none';
  });
}

function fmt(v) {
  if (!isFinite(v)||isNaN(v)) return '';
  if (v===0) return '0';
  const a=Math.abs(v);
  let s;
  if (a<0.01) s=v.toPrecision(3);
  else if (a<1) s=v.toFixed(4);
  else if (a<1000) s=v.toFixed(2);
  else if (a<100000) s=v.toFixed(1);
  else s=Math.round(v).toString();
  return s.includes('.')?s.replace(/\.?0+$/,''):s;
}

// ── Actions ──
function reset() {
  if (!current||!cfg?.units) return;
  clearAll(); lastInput=null;
  const first=cfg.units[0], el=document.getElementById('uc-input-'+first);
  if (el) { el.value='1'; doConvert(first,1); el.focus(); }
  toast('Reset to defaults','info',2000);
}

function copy() {
  if (!current||!cfg?.units) { toast('No converter active','warning',2500); return; }
  let text='';
  if (lastInput?.value?.trim()) {
    const uid=lastInput.id.replace('uc-input-','');
    if (cfg.units.includes(uid)) text=`${lastInput.value} ${cfg.symbols[uid]||uid} (${cfg.labels[uid]||uid})`;
  }
  if (!text) {
    const lines=cfg.units.map(u=>{
      const el=document.getElementById('uc-input-'+u);
      if (el?.value?.trim()) return `${el.value} ${cfg.symbols[u]||u} (${cfg.labels[u]||u})`;
      return null;
    }).filter(Boolean);
    text=lines.join('\n');
  }
  if (text) {
    navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard','success',2500),()=>toast('Copy failed','error',3000));
  } else toast('Enter a value first','warning',2500);
}

function loadNext() {
  const ci=order.indexOf(current);
  if (ci<order.length-1) loadConverter(order[ci+1]);
}

// ── Toast ──
function toast(msg, type='info', dur=3000) {
  const wrap=document.getElementById('uc-toasts');
  if (!wrap) return;
  const t=document.createElement('div');
  t.className=`uc-toast ${type}`;
  const icons={success:'fa-check',info:'fa-info-circle',warning:'fa-exclamation-triangle',error:'fa-times-circle'};
  t.innerHTML=`<i class="fas ${icons[type]||'fa-info-circle'}"></i>${msg}`;
  wrap.appendChild(t);
  setTimeout(()=>{
    t.classList.add('fade-out');
    setTimeout(()=>t.remove(),250);
  },dur);
}

// Public API
return {
  initHub, showHub, loadConverter, reset, copy, loadNext,
  _clearOne(unit) {
    const el=document.getElementById('uc-input-'+unit); if(!el) return;
    el.value=''; clearAll(unit); el.focus();
    el.nextElementSibling.style.display='none';
  },
  toast
};

})(); // end UCEngine
