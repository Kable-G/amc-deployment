<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AMC System Check</title>

<!-- CSS (root -> /frontend/...) -->
<link rel="stylesheet" href="/frontend/css/amc-globalshell.css"/>
<link rel="stylesheet" href="/frontend/css/sidebar.css"/>
<link rel="stylesheet" href="/frontend/css/amc-avatar-styles.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>

<!-- auth must be a module -->
<script type="module" src="/frontend/components/auth.js"></script>

<style>
  :root { color-scheme: light dark; }
  body { font-family: Inter, system-ui, sans-serif; margin:0; background:#0b0f16; color:#e5e7eb; }
  main { padding:24px; }
  table{border-collapse:collapse;margin-top:12px;width:100%;max-width:680px;background:#0f172a;border-radius:10px;overflow:hidden}
  th,td{padding:.65rem 1rem;border-bottom:1px solid #1f2937;text-align:left}
  thead th{background:#111827;color:#cbd5e1;font-weight:600}
  tr:last-child td{border-bottom:none}
  .ok{color:#16a34a;font-weight:700}.fail{color:#ef4444;font-weight:700}
</style>
</head>
<body>
  <amc-header></amc-header>
  <div id="amcSidebar"></div>

  <main>
    <h1>AutoMediaCenter System Diagnostics</h1>
    <p>This page verifies that all global modules are loaded and communicating correctly.</p>
    <table id="amcStatusTable"><thead><tr><th>Module</th><th>Status</th><th>Notes</th></tr></thead><tbody>
      <tr><td>auth.js</td><td id="st-auth">–</td><td></td></tr>
      <tr><td>sidebar.js</td><td id="st-sidebar">–</td><td></td></tr>
      <tr><td>amc-header.js</td><td id="st-header">–</td><td></td></tr>
      <tr><td>amc-avatar-system.js</td><td id="st-avatar">–</td><td></td></tr>
      <tr><td>globalshell.js</td><td id="st-shell">–</td><td></td></tr>
      <tr><td>kebab-portal-NO-HOVER.js</td><td id="st-kebab">–</td><td></td></tr>
    </tbody></table>
  </main>

  <!-- portal target -->
  <div id="kebab-portal" style="position:fixed;inset:0;pointer-events:none;z-index:2147483646;"></div>

  <!-- JS (root -> /frontend/...) -->
  <script defer src="/frontend/components/sidebar.js"></script>
  <script defer src="/frontend/components/amc-header.js"></script>
  <script defer src="/frontend/components/amc-avatar-system.js"></script>
  <script defer src="/frontend/components/globalshell.js"></script>
  <script defer src="/frontend/components/kebab-portal-NO-HOVER.js"></script>

  <script>
  window.addEventListener('error', e=>{
    const row=document.querySelector('#amcStatusTable tbody');const tr=document.createElement('tr');
    tr.innerHTML=`<td>runtime</td><td class="fail">✖ Fail</td><td>${e.message}</td>`;row.appendChild(tr);
  });
  document.addEventListener('DOMContentLoaded',()=>{
    const set=(id,ok,msg="")=>{const td=document.getElementById(id);td.textContent=ok?"✔ OK":"✖ Fail";td.className=ok?"ok":"fail";td.nextElementSibling.textContent=msg;};
    try{const u=localStorage.getItem('user')||localStorage.getItem('currentUser');set('st-auth',!!u,u?'User token present':'No user in storage');}
    catch{set('st-auth',false,'auth.js error');}
    setTimeout(()=>{const el=document.querySelector('.amc-sidebar,#amcSidebar');const state=document.body.classList.contains('sidebar-collapsed')?'Collapsed':'Expanded';set('st-sidebar',!!el,el?state:'Not built');},500);
    set('st-header',!!document.querySelector('header,amc-header'),'Header element found');
    window.addEventListener('avatarSystemReady',()=>set('st-avatar',true,'Avatar system ready'));
    setTimeout(()=>{if(!document.getElementById('st-avatar').className){const ok=typeof window.AMCAvatar!=='undefined'||document.querySelector('.amc-avatar-container');set('st-avatar',!!ok,ok?'Instance/container detected':'Not loaded');}},1000);
    window.addEventListener('amcShellReady',()=>set('st-shell',true,'Shell initialized'));
    setTimeout(()=>{if(!document.getElementById('st-shell').className){set('st-shell',typeof window.AMCShell!=='undefined',typeof window.AMCShell!=='undefined'?'Global object present':'Missing');}},1200);
    setTimeout(()=>{const ok=document.getElementById('kebab-portal')||typeof window.initKebabPortal==='function';set('st-kebab',!!ok,ok?'Portal/function found':'No portal detected');},1400);
  });
  </script>
</body></html>
