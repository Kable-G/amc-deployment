<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AutoMediaCenter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8f9ff 0%, #fff5f5 100%);
            color: #3c4043;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            padding: 48px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #1a73e8;
            margin-bottom: 32px;
            letter-spacing: -0.8px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e8eaed;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Google Sans', sans-serif;
            transition: all 0.2s ease;
            background-color: #fafbfc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a73e8;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15);
            transform: translateY(-1px);
        }

        .form-group input.error {
            border-color: #ea4335;
            background-color: #fef7f0;
        }

        .form-group input.success {
            border-color: #34a853;
        }

        .field-helper {
            font-size: 12px;
            color: #5f6368;
            margin-top: 4px;
            line-height: 1.4;
        }

        .field-helper.error {
            color: #ea4335;
        }

        .field-helper.success {
            color: #34a853;
        }

        .password-field {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 12px;
            background: none;
            border: none;
            color: #5f6368;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            z-index: 10;
            height: 32px;
            width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #202124;
            background: rgba(95, 99, 104, 0.1);
        }

        .password-strength {
            height: 4px;
            background: #e8eaed;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .password-strength.weak .password-strength-bar {
            width: 33%;
            background: #ea4335;
        }

        .password-strength.medium .password-strength-bar {
            width: 66%;
            background: #fbbc04;
        }

        .password-strength.strong .password-strength-bar {
            width: 100%;
            background: #34a853;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Google Sans', sans-serif;
            width: 100%;
            margin-top: 16px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1557b0;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #dadce0;
            color: #9aa0a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-link {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e8eaed;
        }

        .back-link a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fef7f0;
            border: 1px solid #ea4335;
            color: #ea4335;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .success-message {
            background: #e8f5e8;
            border: 1px solid #34a853;
            color: #34a853;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">AutoMediaCenter</div>
        
        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter your new password below. Make sure it's strong and secure.</p>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>
        
        <form id="resetPasswordForm">
            <div class="form-group password-field">
                <input type="password" id="newPassword" placeholder="New Password" required minlength="8">
                <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar"></div>
                </div>
                <div class="field-helper" id="passwordHelper">At least 8 characters, one uppercase, one number.</div>
            </div>
            
            <div class="form-group password-field">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="8">
                <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
                <div class="field-helper" id="confirmHelper">Passwords must match.</div>
            </div>
            
            <button type="submit" class="btn-primary" id="resetSubmit" disabled>Reset Password</button>
        </form>
        
        <div class="back-link">
            <a href="landing-page-twitter-style.html">← Back to Sign In</a>
        </div>
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        if (!resetToken) {
            showError('Invalid or missing reset token. Please request a new password reset.');
            document.getElementById('resetPasswordForm').style.display = 'none';
        }

        // Form validation functions
        function validatePassword(password) {
            return password.length >= 8 && /[A-Z]/.test(password) && /\d/.test(password);
        }

        function getPasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            
            if (score <= 2) return 'weak';
            if (score <= 4) return 'medium';
            return 'strong';
        }

        function updatePasswordStrength(password) {
            const strengthMeter = document.getElementById('passwordStrength');
            const strength = getPasswordStrength(password);
            strengthMeter.className = `password-strength ${strength}`;
        }

        function updateFieldState(field, isValid) {
            field.classList.remove('error', 'success');
            if (field.value.length === 0) return;
            
            if (isValid) {
                field.classList.add('success');
            } else {
                field.classList.add('error');
            }
        }

        function checkFormValidity() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('resetSubmit');
            
            const passwordValid = validatePassword(newPassword);
            const passwordsMatch = newPassword === confirmPassword && confirmPassword.length > 0;
            
            // Update password helper
            const passwordHelper = document.getElementById('passwordHelper');
            const passwordField = document.getElementById('newPassword');
            
            if (newPassword.length === 0) {
                passwordHelper.textContent = 'At least 8 characters, one uppercase, one number.';
                passwordHelper.className = 'field-helper';
            } else if (passwordValid) {
                passwordHelper.textContent = 'Password meets requirements ✓';
                passwordHelper.className = 'field-helper success';
            } else {
                passwordHelper.textContent = 'Password must have 8+ characters, one uppercase, one number.';
                passwordHelper.className = 'field-helper error';
            }
            
            updateFieldState(passwordField, passwordValid);
            
            // Update confirm password helper
            const confirmHelper = document.getElementById('confirmHelper');
            const confirmField = document.getElementById('confirmPassword');
            
            if (confirmPassword.length === 0) {
                confirmHelper.textContent = 'Passwords must match.';
                confirmHelper.className = 'field-helper';
            } else if (passwordsMatch) {
                confirmHelper.textContent = 'Passwords match ✓';
                confirmHelper.className = 'field-helper success';
            } else {
                confirmHelper.textContent = 'Passwords do not match.';
                confirmHelper.className = 'field-helper error';
            }
            
            updateFieldState(confirmField, passwordsMatch);
            
            submitBtn.disabled = !(passwordValid && passwordsMatch);
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const toggle = field.nextElementSibling;
            
            if (field.type === 'password') {
                field.type = 'text';
                toggle.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/><path d="M2 2l20 20-1.41 1.41L2 4.41z" stroke="currentColor" stroke-width="2"/></svg>';
            } else {
                field.type = 'password';
                toggle.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const newPasswordField = document.getElementById('newPassword');
            const confirmPasswordField = document.getElementById('confirmPassword');
            
            newPasswordField.addEventListener('input', function() {
                updatePasswordStrength(this.value);
                checkFormValidity();
            });
            
            confirmPasswordField.addEventListener('input', checkFormValidity);
        });

        // Form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('resetSubmit');
            
            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (!validatePassword(newPassword)) {
                showError('Password must be at least 8 characters with uppercase and number');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: resetToken,
                        password: newPassword
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showSuccess(data.message);
                    document.getElementById('resetPasswordForm').style.display = 'none';
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'landing-page-twitter-style.html';
                    }, 3000);
                } else {
                    const error = await response.json();
                    showError(error.error || 'Failed to reset password');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showError('Network error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
                checkFormValidity();
            }
        });
    </script>
</body>
</html>
