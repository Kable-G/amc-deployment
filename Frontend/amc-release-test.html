<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>AMC Article Renderer Test</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="css/amc-globalshell.css">
    <!-- Article Styles -->
    <link rel="stylesheet" href="css/amc-release-article.css">
    
    <style>
        body { margin: 0; padding: 20px; font-family: Inter, sans-serif; }
        .test-container { max-width: 1200px; margin: 0 auto; }
        .test-header { text-align: center; margin-bottom: 30px; }
        .test-header h1 { color: var(--text-headings); margin-bottom: 10px; }
        .test-header p { color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1><i class="fas fa-newspaper"></i> AMC Article Renderer Test</h1>
            <p>Testing the new article renderer with mock data</p>
        </div>
        
        <!-- Article Container -->
        <div id="amc-article-container">
            <div style="text-align: center; padding: 50px; color: var(--text-secondary);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2em; margin-bottom: 20px;"></i>
                <p>Loading article content...</p>
            </div>
        </div>
    </div>
    
    <!-- Components -->
    <script src="components/article-renderer.js"></script>
    
    <script>
        // Mock release data for testing
        const mockReleaseData = {
            title: "The all-new Mercedes-Benz GLC with EQ Technology: Effortlessly uncompromising",
            leadParagraph: "Mercedes-Benz presents the new GLC with innovative EQ Technology, combining luxury, performance, and sustainability in a groundbreaking SUV design.",
            summary: `
                <h2>Revolutionary Design Meets Advanced Technology</h2>
                <p>The new Mercedes-Benz GLC represents a significant leap forward in automotive innovation, seamlessly integrating EQ Technology with the brand's renowned luxury and performance standards. This latest addition to the Mercedes-Benz lineup showcases the company's commitment to sustainable mobility without compromising on the driving experience that customers expect.</p>
                
                <h3>Key Features and Innovations</h3>
                <p>The GLC with EQ Technology features a state-of-the-art hybrid powertrain that delivers exceptional efficiency while maintaining the dynamic performance characteristics that define the Mercedes-Benz driving experience. The vehicle incorporates advanced battery technology, intelligent energy management systems, and regenerative braking capabilities.</p>
                
                <p>Interior design has been completely reimagined with sustainable materials and cutting-edge digital interfaces. The MBUX infotainment system provides intuitive control over all vehicle functions, while the premium cabin offers unparalleled comfort and connectivity features.</p>
                
                <h3>Performance and Efficiency</h3>
                <p>The hybrid powertrain combines a refined internal combustion engine with an electric motor, delivering smooth acceleration and impressive fuel economy. Advanced aerodynamics and lightweight construction contribute to the vehicle's overall efficiency, while maintaining the robust build quality expected from Mercedes-Benz.</p>
                
                <p>The intelligent all-wheel-drive system adapts to various driving conditions, ensuring optimal traction and stability in all weather conditions. Whether navigating city streets or exploring off-road terrain, the GLC provides confidence-inspiring performance.</p>
                
                <h3>Technology Integration</h3>
                <p>The vehicle features comprehensive connectivity options, including wireless smartphone integration, over-the-air updates, and advanced driver assistance systems. The EQ Technology platform enables seamless integration with smart home systems and renewable energy sources.</p>
                
                <p>Safety remains paramount with a comprehensive suite of active and passive safety features, including advanced collision avoidance systems, intelligent cruise control, and enhanced visibility technologies.</p>
            `,
            brand: "Mercedes-Benz",
            releaseDate: "2025-11-14",
            releaseTime: "20:35",
            timezone: "CET",
            uuid: "test-uuid-12345",
            notesToEditors: "<p>High-resolution images and additional technical specifications are available upon request. Test drives can be arranged through authorized Mercedes-Benz dealers.</p>",
            aboutClient: "<p>Mercedes-Benz is a global automotive leader, renowned for luxury vehicles, innovative technology, and sustainable mobility solutions. The brand continues to shape the future of transportation through continuous innovation and commitment to excellence.</p>",
            images: [
                { originalName: "GLC_Exterior_01.jpg", altText: "Mercedes-Benz GLC exterior view" },
                { originalName: "GLC_Interior_01.jpg", altText: "Mercedes-Benz GLC interior" },
                { originalName: "GLC_Technology_01.jpg", altText: "GLC EQ Technology features" }
            ],
            videos: [
                { originalName: "GLC_Launch_Video.mp4", altText: "GLC launch presentation" }
            ],
            supplementaryDocs: [
                { originalName: "GLC_Technical_Specifications.pdf", size: 2048000 },
                { originalName: "GLC_Press_Kit.pdf", size: 5120000 }
            ]
        };
        
        // Initialize article renderer with mock data
        document.addEventListener('DOMContentLoaded', function() {
            const articleContainer = document.getElementById('amc-article-container');
            
            if (window.AMCArticleRenderer && articleContainer) {
                console.log('Initializing AMC Article Renderer with mock data...');
                
                // Use the correct constructor - pass container ID as string, not element
                const articleRenderer = new AMCArticleRenderer('amc-article-container');
                
                if (articleRenderer.container) {
                    // Load the release data to render the article
                    articleRenderer.loadRelease(mockReleaseData);
                    console.log('Article renderer initialized and loaded successfully');
                } else {
                    console.error('Article renderer failed to initialize');
                }
            } else {
                console.error('AMC Article Renderer not available or container not found');
                if (articleContainer) {
                    articleContainer.innerHTML = `
                        <div style="text-align: center; padding: 50px; color: red;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 2em; margin-bottom: 20px;"></i>
                            <h3>Article Renderer Not Available</h3>
                            <p>The AMC Article Renderer component could not be loaded.</p>
                        </div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
